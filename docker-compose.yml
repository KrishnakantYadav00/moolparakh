services:

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: moolparakh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: krishna
      POSTGRES_DB: fproject2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fproject2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── App (Backend API + React Frontend) ───────────────────────────────────
  app:
    image: moolparakh-d-image
    container_name: moolparakh_app
    restart: unless-stopped
    ports:
      - "80:5000"
    environment:
      DATABASE_URL: postgresql://postgres:krishna@postgres:5432/fproject2026
      NODE_ENV: production
      PORT: 5000
      # Optional: add R2 vars here if you configure Cloudflare R2
      # R2_ACCOUNT_ID: ""
      # R2_ACCESS_KEY_ID: ""
      # R2_SECRET_ACCESS_KEY: ""
      # R2_BUCKET_NAME: moolparakh-docs
      # R2_PUBLIC_URL: ""
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
