services:
  postgres:
    image: postgres:16-alpine
    container_name: moolparakh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: krishna
      POSTGRES_DB: fproject2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
